schema: spec-driven

context: |
 技术栈：TypeScript，Node.js (≥20.19.0)，ESM 模块
 包管理器：pnpm
 CLI 框架：Commander.js

 产品语言：
 - 以面向用户的产品行为语言撰写 OpenSpec proposal 和规格说明
 - 需求应描述体验、可观察的行为和产品契约
 - 如果一个积极的用户结果可以表达同样的规则，就避免使用否定性的 SHALL 语句
 - 除非机制本身属于面向用户的契约，否则将内部机制放在 design.md 或 tasks.md 中

 跨平台需求：
 - 本工具在 macOS、Linux 和 Windows 上均可运行
 - 始终使用 path.join() 或 path.resolve() 处理文件路径——切勿硬编码斜杠
 - 绝不假定正斜杠路径分隔符
 - 测试必须使用 path.join() 来构造预期的路径值，而非硬编码字符串
 - 注意文件系统中的大小写敏感性差异

rules:
 specs:
 - 处理文件路径时，应包含 Windows 路径处理的场景
 - 涉及路径的需求必须明确跨平台行为
 - 优先描述面向用户的产品行为和可观察的结果，而非内部实现机制
 - 仅当机制属于产品契约的一部分时，才包含 HOW 细节
 - 如果我们生成 artifact，需通过显式的列表查找指定删除/修改，而非 schema 匹配
 tasks:
 - 当变更涉及文件路径时，添加 Windows CI 验证作为一个任务
 - 包含跨平台测试的考量
 design:
 - 记录任何特定于平台的行为或限制
 - 优先使用 Node.js path 模块而非字符串操作来处理路径
 - 使用已有的常量和列表——不要发明检测机制
 - 优先使用显式查找而非 schema 匹配或正则表达式
 - 如果我们生成某物，则用常量中的名称来追踪它
